name: Evaluate agent

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deepeval:
    runs-on: ubuntu-latest
    # Do not expose repository secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run DeepEval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
          LANGFUSE_TRACING_ENVIRONMENT: ci
          PYTHONPATH: ${{ github.workspace }}
        run: deepeval test run tests/test_agent_evaluation.py
